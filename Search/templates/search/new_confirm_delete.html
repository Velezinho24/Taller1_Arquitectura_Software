{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
  <h3>Delete: {{ object.headline }}</h3>
  <p>Are you sure?</p>
  <form method="post">{% csrf_token %}
    <button class="btn btn-danger" type="submit">Yes, delete</button>
    <a class="btn btn-secondary" href="{% url 'search:news_detail' object.pk %}">Cancel</a>
  </form>
</div>
{% endblock %}
